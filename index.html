<!--
Single-file static website for ARAUC token
Instructions:
1) Replace `logo.png` with your provided logo file (same folder as this index.html).
2) Replace the `WHITEPAPER_URL` value in the script block below with the real whitepaper link.
3) Open this file in a browser to preview. To deploy, upload both index.html and logo.png to your host (Netlify, Vercel static site, GitHub Pages, or any static-file hosting).
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARaucaria Token (ARAUC)</title>
  <meta name="description" content="ARAUC — community utility token on Solana. View the white paper and learn more." />
  <meta name="theme-color" content="#0b6e4f" />
  <style>
    :root{
      --bg: #0f1720;
      --card: #0b6e4f;
      --muted: #98a2ad;
      --glass: rgba(255,255,255,0.03);
      --accent: #10b981;
      --maxw: 900px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#02121a 0%, #071827 100%);color:#e6eef0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .container{width:100%;max-width:var(--maxw);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:16px;padding:36px;box-shadow:0 10px 30px rgba(2,6,23,0.6);backdrop-filter: blur(6px);}
    .header{display:flex;gap:20px;align-items:center}
    .logo{width:96px;height:96px;border-radius:16px;overflow:hidden;flex:0 0 96px;background:var(--glass);display:flex;align-items:center;justify-content:center}
    .logo img{max-width:90%;max-height:90%;display:block}
    h1{margin:0;font-size:24px}
    p.lead{margin:8px 0 18px;color:var(--muted)}
    .card{background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:18px;border-radius:12px;margin-top:18px;border:1px solid rgba(255,255,255,0.03)}
    .mint{font-family:monospace;background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;overflow:auto}
    .actions{display:flex;gap:12px;margin-top:18px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:10px;border:0;cursor:pointer;font-weight:600}
    .btn-primary{background:var(--accent);color:#042014}
    .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    footer{margin-top:22px;color:var(--muted);font-size:13px}
    @media (max-width:600px){.header{flex-direction:row}.logo{width:72px;height:72px}}
  </style>
</head>
<body>
  <main class="container" role="main">
    <div class="header">
      <div class="logo" id="logoWrap">
        <!-- Drop your logo file named `logo.png` in the same folder. If not present, an SVG placeholder will render. -->
        <img src="arauctoken.png" alt="ARaucaria logo" id="logoImg" onerror="this.style.display='none'" />
        <svg id="logoFallback" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" style="display:block">
          <rect width="24" height="24" rx="6" fill="#073b2b" />
          <path d="M12 4v8" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 12c1-2 3-3 4-3s3 1 4 3" stroke="#9ee7c9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div style="flex:1">
        <h1>ARaucaria Token — <span style="opacity:0.9">ARAUC</span></h1>
        <p class="lead">Community utility token on the Solana blockchain. Built for sustainable growth, community initiatives and on-chain experimentation.</p>
        <div class="card">
          <strong>Mint Address</strong>
          <div class="mint" id="mintAddr">APzZG3Pk5v81xRJLQMJ8b1oNnzeoMC27UFFaVjPVjcBS</div>
          <div class="actions">
            <button class="btn btn-primary" id="openWhitepaper">View Whitepaper</button>
            <a class="btn btn-ghost" href="https://solscan.io/token/APzZG3Pk5v81xRJLQMJ8b1oNnzeoMC27UFFaVjPVjcBS" target="_blank" rel="noopener">View on Solscan</a>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div>Made with ♥ for the ARAUC community.</div>
    </footer>
  </main>

  <script>
    // EDIT THIS: set the public URL to your whitepaper PDF or hosted page
    const WHITEPAPER_URL = "whitepaper_arauc.pdf";

    document.getElementById('openWhitepaper').addEventListener('click', function(){
      if(!WHITEPAPER_URL || WHITEPAPER_URL === 'REPLACE_WITH_WHITEPAPER_URL'){
        alert('Please provide the whitepaper URL in the script (WHITEPAPER_URL).');
        return;
      }
      window.open(WHITEPAPER_URL, '_blank', 'noopener');
    });

    // Helpful UX: if logo not provided, keep the SVG fallback visible
    const logoImg = document.getElementById('logoImg');
    logoImg.addEventListener('error', ()=>{
      document.getElementById('logoFallback').style.display='block';
    });

    // Accessibility: allow copying the mint address
    const mint = document.getElementById('mintAddr');
    mint.title = 'Click to copy mint address';
    mint.style.cursor = 'pointer';
    mint.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(mint.textContent.trim());
        const old = mint.textContent;
        mint.textContent = 'Copied ✔';
        setTimeout(()=> mint.textContent = old, 1500);
      }catch(e){
        alert('Copying not supported.');
      }
    });
  </script>
</body>
</html>
